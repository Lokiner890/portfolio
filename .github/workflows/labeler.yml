# Adds the changelog_unchanged label to pull requests that don't update CHANGELOG.md.
# Rules are in .github/labeler.yml, see https://github.com/actions/labeler

name: Labeler

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: [self-hosted, coax]
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true # remove the label once CHANGELOG.md is updated
